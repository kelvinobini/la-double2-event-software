<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leads — LA Double2 Admin</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --green:#0E7A52;
    --green-hover:#0A5C3E;
    --bg:#FAF8F5;
    --bg-alt:#FFFFFF;
    --text:#12211B;
    --muted:#5C6B64;
    --border:#E5E0D8;
    --accent:#E0A340;
    --radius-sm:12px;
    --radius-lg:16px;
    --shadow:0 4px 24px rgba(18,33,27,0.06);
    --danger:#C0392B;
    --on-green:#FFFFFF;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12211B;
      --bg-alt:#182920;
      --text:#F2EFE9;
      --muted:#A9B7AE;
      --border:#2A3D33;
      --green:#22A473;
      --green-hover:#2FC189;
      --accent:#E8B968;
      --shadow:0 4px 24px rgba(0,0,0,0.35);
      --danger:#E5776A;
      --on-green:#0A160F;
      color-scheme:dark;
    }
  }
  *,*::before,*::after{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;
  }
  a{color:inherit;}
  .wrap{max-width:1200px;margin:0 auto;padding:32px 24px 64px;}
  header{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding-bottom:24px;margin-bottom:24px;border-bottom:1px solid var(--border);flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem;}
  .brand .mark{width:28px;height:28px;border-radius:8px;background:var(--green);color:var(--on-green);display:flex;align-items:center;justify-content:center;font-size:0.85rem;font-weight:800;}
  .header-actions{display:flex;align-items:center;gap:12px;}
  .btn{
    display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;
    font-weight:700;font-size:0.88rem;text-decoration:none;border:1px solid var(--border);
    background:var(--bg-alt);color:var(--text);cursor:pointer;
  }
  .btn:hover{border-color:var(--green);color:var(--green);}
  h1{font-size:1.5rem;margin:0;}
  .sub{color:var(--muted);font-size:0.9rem;margin-top:4px;}
  .state{padding:40px 0;text-align:center;color:var(--muted);}
  .state.err{color:var(--danger);}
  .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--bg-alt);box-shadow:var(--shadow);}
  table{width:100%;border-collapse:collapse;font-size:0.86rem;min-width:920px;}
  th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:top;}
  th{font-size:0.72rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted);font-weight:700;background:var(--bg);}
  tr:last-child td{border-bottom:none;}
  td.msg{max-width:280px;white-space:pre-wrap;word-break:break-word;}
  td.date{white-space:nowrap;color:var(--muted);}
  .count{margin-top:16px;color:var(--muted);font-size:0.85rem;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="mark" aria-hidden="true">L2</span>LA Double2 — Leads</div>
    <div class="header-actions">
      <button class="btn" type="button" id="refresh-btn">Refresh</button>
      <a class="btn" href="index.html">Back to site</a>
    </div>
  </header>
  <h1>Enquiries</h1>
  <p class="sub">Submissions from the contact form, newest first.</p>

  <div id="state" class="state">Loading…</div>
  <div id="table-holder" hidden>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Venue type</th>
            <th>Volume</th>
            <th>Timeline</th>
            <th>Message</th>
          </tr>
        </thead>
        <tbody id="leads-body"></tbody>
      </table>
    </div>
    <p class="count" id="count-line"></p>
  </div>
</div>

<script>
  (function(){
    var stateEl = document.getElementById('state');
    var holder = document.getElementById('table-holder');
    var body = document.getElementById('leads-body');
    var countLine = document.getElementById('count-line');
    var refreshBtn = document.getElementById('refresh-btn');

    function escapeHtml(s){
      return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
        return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
      });
    }

    function formatDate(iso){
      try{
        var d = new Date(iso);
        return d.toLocaleString(undefined, { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
      }catch(e){ return iso; }
    }

    function render(leads){
      if(!leads.length){
        stateEl.hidden = false;
        stateEl.className = 'state';
        stateEl.textContent = 'No enquiries yet.';
        holder.hidden = true;
        return;
      }
      stateEl.hidden = true;
      holder.hidden = false;
      body.innerHTML = leads.map(function(lead){
        return '<tr>' +
          '<td class="date">' + escapeHtml(formatDate(lead.created_at)) + '</td>' +
          '<td>' + escapeHtml(lead.name) + '</td>' +
          '<td><a href="mailto:' + escapeHtml(lead.email) + '">' + escapeHtml(lead.email) + '</a></td>' +
          '<td>' + (lead.phone ? '<a href="tel:' + escapeHtml(lead.phone) + '">' + escapeHtml(lead.phone) + '</a>' : '—') + '</td>' +
          '<td>' + escapeHtml(lead.venue_type || '—') + '</td>' +
          '<td>' + escapeHtml(lead.event_volume || '—') + '</td>' +
          '<td>' + escapeHtml(lead.timeline || '—') + '</td>' +
          '<td class="msg">' + escapeHtml(lead.message || '—') + '</td>' +
        '</tr>';
      }).join('');
      countLine.textContent = leads.length + (leads.length === 1 ? ' enquiry' : ' enquiries');
    }

    function load(){
      stateEl.hidden = false;
      holder.hidden = true;
      stateEl.className = 'state';
      stateEl.textContent = 'Loading…';
      fetch('/api/leads', { headers: { 'Accept': 'application/json' } })
        .then(function(r){ return r.json().then(function(json){ return { status: r.status, json: json }; }); })
        .then(function(res){
          if(res.status === 200 && res.json.ok){
            render(res.json.leads || []);
          } else {
            stateEl.className = 'state err';
            stateEl.textContent = (res.json && res.json.error) || 'Could not load enquiries.';
          }
        })
        .catch(function(){
          stateEl.className = 'state err';
          stateEl.textContent = 'Network error loading enquiries.';
        });
    }

    refreshBtn.addEventListener('click', load);
    load();
  })();
</script>
</body>
</html>
